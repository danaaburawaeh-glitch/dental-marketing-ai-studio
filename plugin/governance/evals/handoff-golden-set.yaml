# مجموعة عقد التسليم الذهبية — Handoff Golden Set
# فحص بنيوي حتمي لـ handoff object مقابل governance/handoff-schema.yaml —
# لا يفحص صحة المحتوى الفعلي (data/conclusions)، فقط اكتمال البنية وقواعد الصلاحية.

meta:
  suite_id: handoff-golden-set
  version: "1.0"
  status: ACTIVE

cases:

  - id: valid-complete-handoff
    type: schema_check
    handoff:
      schema_version: "1.0"
      request_id: req-001
      parent_task_id: null
      task_id: task-001
      from_assistant: instagram-data-analyst
      from_version: "1.1.0"
      to_assistant: instagram-funnel-diagnostician
      intent: "تشخيص نقطة تسرّب القمع من مؤشرات الأسبوع"
      input_summary: "معدلات المدى والاحتفاظ لآخر ٧ أيام مقابل الفترة السابقة"
      required_context: ["knowledge/growth-weekly/"]
      output:
        data: {reach: 12000, retention: 0.34}
        conclusions: ["الاحتفاظ أقل من المعتاد بـ ١٢٪"]
        uncertainties: []
        missing_information: []
        warnings: []
        sources: ["Windsor.ai — تقرير أسبوعي"]
      safety: {status: OK, flags: []}
      execution: {status: COMPLETE, confidence: HIGH, timestamp: "2026-08-21T10:00:00Z"}
    expect: VALID

  - id: missing-required-field
    type: schema_check
    handoff:
      schema_version: "1.0"
      request_id: req-002
      task_id: task-002
      from_assistant: instagram-data-analyst
      to_assistant: instagram-funnel-diagnostician
      # intent مفقود عمداً
      input_summary: "بيانات ناقصة الوصف"
      output: {data: {}, conclusions: [], uncertainties: [], missing_information: [], warnings: [], sources: []}
      safety: {status: OK, flags: []}
      execution: {status: COMPLETE, confidence: LOW, timestamp: "2026-08-21T10:05:00Z"}
    expect: SCHEMA_INVALID
    reason: intent حقل إلزامي غائب

  - id: safety-status-contradiction
    type: schema_check
    handoff:
      schema_version: "1.0"
      request_id: req-003
      parent_task_id: null
      task_id: task-003
      from_assistant: content-case-post-reviewer
      from_version: "1.1.0"
      to_assistant: instagram-content-architect
      intent: "مراجعة منشور حالة"
      input_summary: "كابشن يحتوي وعداً بنتيجة محددة لمريض بعينه"
      required_context: []
      output: {data: {}, conclusions: [], uncertainties: [], missing_information: [], warnings: ["نية سريرية تفصيلية"], sources: []}
      safety: {status: SAFETY_BLOCK, flags: ["CLINICAL_INTENT"]}
      execution: {status: COMPLETE, confidence: HIGH, timestamp: "2026-08-21T10:10:00Z"}
    expect: SCHEMA_INVALID
    reason: >
      safety.status=SAFETY_BLOCK يستوجب execution.status=SAFETY_BLOCK أيضاً — هنا COMPLETE، تناقض.

  - id: unknown-status-code
    type: schema_check
    handoff:
      schema_version: "1.0"
      request_id: req-004
      parent_task_id: null
      task_id: task-004
      from_assistant: instagram-data-analyst
      from_version: "1.1.0"
      to_assistant: instagram-experimentation-manager
      intent: "تجهيز أرقام لتصميم تجربة"
      input_summary: "مؤشرات آخر أسبوعين"
      required_context: []
      output: {data: {}, conclusions: [], uncertainties: [], missing_information: [], warnings: [], sources: []}
      safety: {status: OK, flags: []}
      execution: {status: DONE, confidence: HIGH, timestamp: "2026-08-21T10:15:00Z"}
    expect: SCHEMA_INVALID
    reason: "'DONE' ليس من status_codes المعتمَدة — الصحيح COMPLETE"

  - id: incompatible-schema-version
    type: schema_check
    handoff:
      schema_version: "0.9"
      request_id: req-005
      parent_task_id: null
      task_id: task-005
      from_assistant: instagram-data-analyst
      from_version: "1.1.0"
      to_assistant: instagram-funnel-diagnostician
      intent: "تشخيص"
      input_summary: "بيانات"
      required_context: []
      output: {data: {}, conclusions: [], uncertainties: [], missing_information: [], warnings: [], sources: []}
      safety: {status: OK, flags: []}
      execution: {status: COMPLETE, confidence: MEDIUM, timestamp: "2026-08-21T10:20:00Z"}
    expect: SCHEMA_INVALID
    reason: schema_version 0.9 لا يطابق 1.0 الحالي في handoff-schema.yaml
