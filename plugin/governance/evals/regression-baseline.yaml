# خط الأساس للانحدار — Regression Baseline
# نسخة مجمَّدة من governance/routing-tests.yaml وقت اعتماد Foundation Hardening +
# System Hardening (2026-08-21) — بعد فصل النطاق وقبل إضافة الـOrchestrator.
# لا تُعدَّل هذه النسخة عند تغيير routing-tests.yaml لاحقاً؛ الغرض هنا الثبات لا
# المزامنة. أي حالة كانت PASS هنا وأصبحت FAIL في تشغيلة لاحقة = انحدار حقيقي،
# يوقف البناء بصرف النظر عن بقية الأرقام (governance/release-policy.md § البوابة ٧).
# لتحديث الخط: قرار حوكمة موثَّق (architecture-change-proposal.md)، لا نسخ تلقائي.

meta:
  suite_id: regression-baseline
  version: "1.1"
  frozen_at: "2026-08-21"
  frozen_after_pass: true   # نُسخت بعد routing_tests.py حقيقي ناجح 29/29
  status: ACTIVE
  updated_by_acp:
  - governance/proposals/2026-08-28-standalone-external-reference-removal.md
  # ٣ حالات فقط (drdana-short-form-video-plan ×2، whatsapp-closing-specialist ×1)
  # حُدِّثت لتعكس معمارية v1.3.0 Standalone — لا إعادة نسخ عامة من routing-tests.yaml.
  # ملاحظة معروفة: حالتا dana-instagram-growth-director (أدناه) لا تزالان تعكسان
  # حالة 2026-08-21 قبل إصلاح v1.2.0 — خارج نطاق هذا الـ ACP، تُترَكان كما هي.

