# مخطط القياس — Telemetry Schema (غير مُفعَّل حالياً)
#
# لا تسجيل فعلي يحدث في هذه المرحلة. هذا الملف يثبّت الشكل فقط، حتى يمكن
# تفعيل تسجيل حقيقي لاحقاً دون إعادة تصميم. لا يستدعيه أي سكربت اليوم.

meta:
  schema_id: telemetry-schema
  schema_version: "1.0"
  status: DRAFT               # لا يُرفَع إلى ACTIVE قبل قرار تفعيل صريح من الطبيب/ة
  owner: clinic-owner
  last_updated: "2026-08-21"

# ── ما يُسجَّل عند التفعيل ────────────────────────────────────────────────────
event:
  request_id:                  # نفس معرّف الطلب في handoff-schema.yaml — يربط التتبّع بالتنفيذ
  intent:                      # النية المستخرَجة (من Orchestrator أو التوجيه المباشر)
  selected_assistant:          # assistant_id المختار لكل خطوة
  orchestration_chain: []      # تسلسل المساعدين الفعلي إن كانت المهمة مركّبة
  knowledge_used: []           # مسارات knowledge/ التي قُرئت فعلياً
  tools_used: []                # الموصّلات/الأدوات المستخدَمة (Gmail، Drive، Windsor، …)
  warnings: []                  # أي تحذير أُصدر أثناء التنفيذ
  status:                       # أحد status_codes في governance/handoff-schema.yaml
  retry_count:                  # عدد إعادة المحاولة لهذه الخطوة، إن وُجدت

# ── ممنوع تخزينه إطلاقاً — بلا استثناء ولو تم التفعيل ────────────────────────
never_store:
  - اسم المريض
  - رقم الجوال
  - رقم الملف الطبي
  - صور المرضى أو أي وسيط بصري لحالة
  - أي PHI (معلومة صحية تعرِّف شخصاً) غير مجهَّلة بالكامل

# ── شرط التفعيل ──────────────────────────────────────────────────────────────
activation:
  requires:
    - قرار موثَّق من الطبيب/ة بتفعيل التسجيل الفعلي
    - مراجعة أن never_store لم تُنتهَك في أي حقل مُقترَح إضافته لاحقاً
    - تخزين منفصل عن أي مكان قد يُقرأ منه سياق مرضى (يُطبَّق عليه نفس عزل PDPL في house-rules.md §٤)
  status_when_ready: ACTIVE
