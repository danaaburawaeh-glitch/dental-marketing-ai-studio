  generated: "2026-08-21"
  phase: foundation-hardening

# ── نطاقات الحوكمة ────────────────────────────────────────────────────────────
tiers:
  T1_studio_uninstalled:
    description: مهارات الاستوديو — نسخة عمل فقط، غير مثبتة في الحساب
    risk: LOW
    rationale: لا اعتمادية على حالة الحساب؛ الترحيل لا يكسر شيئاً قائماً
  T2_studio_installed:
    description: فريق نمو انستغرام — محفوظ فعلياً في حساب الطبيب/ة
    risk: MEDIUM
    rationale: >
      المراجع كلها داخل ملفات نتحكم بها، لكن تغيير المعرّف يستلزم خطوة يدوية
      واحدة (حذف النسخ القديمة من الحساب) وإلا نشأ ازدواج نشط.
  T3_dana_authored_ungoverned:
    description: مهارات كتبتها الطبيب/ة قبل الاستوديو، ولها مراجع خارج سيطرتنا
    risk: HIGH
    rationale: مراجع نصية متبادلة مع مهارات لا تُرحَّل في هذه المرحلة
    action: REVIEW
  T4_vendor:
    description: مهارات Anthropic والحزم الجاهزة
    risk: OUT_OF_SCOPE
    action: KEEP

