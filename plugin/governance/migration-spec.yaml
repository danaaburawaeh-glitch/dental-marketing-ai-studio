# مواصفة الترحيل — تقود scripts/migrate.py وتُشتق منها خريطة الترحيل.
# مصدر الحقيقة أثناء الترحيل فقط؛ بعد التنفيذ تصبح metadata داخل SKILL.md هي المصدر.
#
# ملاحظة v1.3.0 Standalone: حقول `source:` أدناه هي بيانات منشأ (provenance)
# تاريخية — تسجّل من أين هُوجر كل مساعد وقت الترحيل الأصلي، ولا تُقرأ في وقت
# التشغيل من أي Skill أو Script. بعضها مسارات مطلقة كانت خاصة ببيئة عمل
# المُنشئ الأصلي؛ أُبقيت كسجل تاريخي فقط لأنها بلا أي أثر تشغيلي على أي
# مستخدم آخر لهذه الحزمة (انظر tests/dependency-scan.py الذي يستثنيها صراحة).

